%YAML:1.0

BaseConfig:
  minDetectorConfidence: 0.4

TargetManagement:
  enableBboxUnClipping: 0
  maxTargetsPerStream: 600
  minIouDiff4NewTarget: 0.5
  minTrackerConfidence: 0.0
  probationAge: 2
  maxShadowTrackingAge: 10
  earlyTerminationAge: 1

TrajectoryManagement:
  useUniqueID: 0

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  checkClassMatch: 1
  minMatchingScore4Overall: 0.0
  minMatchingScore4SizeSimilarity: 0.0
  minMatchingScore4Iou: 0.0
  matchingScoreWeight4SizeSimilarity: 0.4
  matchingScoreWeight4Iou: 0.6
  tentativeDetectorConfidence: 0.0
  minMatchingScore4TentativeIou: 0.0
  usePrediction4Assoc: 1

StateEstimator:
  stateEstimatorType: 2
  noiseWeightVar4Loc: 0.1
  noiseWeightVar4Vel: 0.01
  useAspectRatio: 1
